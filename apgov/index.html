<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AP Gov Trivia</title>
    <style>
:root {
  color-scheme: dark;
  --bg: #12130f;
  --panel: #1e2118;
  --panel-2: #2b3024;
  --line: rgba(255, 255, 255, 0.13);
  --text: #fbfaf4;
  --muted: #c5c8b4;
  --accent: #ffca3a;
  --accent-2: #73d2de;
  --good: #5ce0a7;
  --bad: #ff6b6b;
  --rose: #ff9f7a;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  background:
    linear-gradient(145deg, rgba(115, 210, 222, 0.15), transparent 28rem),
    linear-gradient(215deg, rgba(255, 202, 58, 0.14), transparent 30rem),
    linear-gradient(180deg, #171811 0%, var(--bg) 100%);
}

button {
  color: inherit;
  font: inherit;
}

.app {
  width: min(1200px, calc(100vw - 28px));
  min-height: 100vh;
  margin: 0 auto;
  padding: 22px 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 18px;
}

.round-controls {
  display: flex;
  align-items: end;
  gap: 10px;
}

.round-controls label {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-size: 0.76rem;
  font-weight: 900;
  text-transform: uppercase;
}

.round-controls select {
  min-height: 48px;
  max-width: 210px;
  padding: 0 36px 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--text);
  font: inherit;
  font-weight: 850;
}

.shelf-link {
  display: inline-block;
  margin-bottom: 10px;
  color: var(--accent);
  font-weight: 850;
  text-decoration: none;
}

.shelf-link:hover {
  text-decoration: underline;
}

.eyebrow {
  margin: 0 0 6px;
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 900;
  text-transform: uppercase;
}

h1 {
  max-width: 12ch;
  margin: 0;
  font-size: clamp(2.4rem, 7vw, 5.3rem);
  line-height: 0.94;
}

.primary-action {
  min-height: 48px;
  padding: 0 18px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: #17130a;
  font-weight: 900;
  cursor: pointer;
}

button:hover,
button:focus-visible,
.shelf-link:focus-visible {
  outline: 3px solid rgba(255, 202, 58, 0.42);
  outline-offset: 3px;
}

.game-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: 18px;
  align-items: start;
}

.stage,
.side-panel {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(24, 32, 36, 0.86);
  box-shadow: 0 24px 58px rgba(0, 0, 0, 0.28);
}

.stage {
  min-height: 650px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.topic-strip {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}

.topic-strip span {
  min-height: 42px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: var(--panel-2);
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 900;
  text-transform: uppercase;
}

.topic-strip span:nth-child(1) {
  color: var(--accent);
}

.topic-strip span:nth-child(2) {
  color: var(--accent-2);
}

.topic-strip span:nth-child(3) {
  color: var(--good);
}

.topic-strip span:nth-child(4) {
  color: #ff9f7a;
}

.topic-strip span:nth-child(5) {
  color: var(--rose);
}

.question-meta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 900;
  text-transform: uppercase;
}

h2 {
  min-height: 120px;
  margin: 0;
  display: flex;
  align-items: center;
  font-size: clamp(1.8rem, 4.3vw, 3.7rem);
  line-height: 1.03;
}

.answers {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.answer {
  min-height: 108px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  cursor: pointer;
  transition: opacity 160ms ease, transform 160ms ease, background 160ms ease;
}

.answer .letter {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.12);
  color: var(--accent);
  font-weight: 950;
}

.answer .text {
  font-size: clamp(1.02rem, 2vw, 1.28rem);
  font-weight: 850;
  line-height: 1.22;
}

.answer.hidden-option {
  opacity: 0.16;
  transform: scale(0.98);
  pointer-events: none;
}

.answer.correct {
  border-color: rgba(92, 224, 167, 0.84);
  background: rgba(92, 224, 167, 0.22);
}

.answer.wrong {
  border-color: rgba(255, 107, 107, 0.72);
  background: rgba(255, 107, 107, 0.18);
}

.timer-row {
  margin-top: auto;
  display: grid;
  grid-template-columns: 1fr 58px;
  gap: 12px;
  align-items: center;
}

.timer-shell {
  height: 18px;
  overflow: hidden;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.12);
}

.timer-bar {
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, var(--good), var(--accent), #ff8f66);
  transition: width 180ms linear;
}

#timeLeft {
  font-size: 2rem;
  text-align: right;
}

.message {
  min-height: 25px;
  margin: 0;
  color: var(--muted);
  font-weight: 850;
}

.side-panel {
  padding: 14px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.stat {
  min-height: 84px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(34, 44, 48, 0.78);
}

.stat span {
  display: block;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 900;
  text-transform: uppercase;
}

.stat strong {
  display: block;
  margin-top: 5px;
  font-size: 1.75rem;
}

.stat-wide {
  grid-column: 1 / -1;
  min-height: 70px;
}

.stat-wide strong {
  font-size: 1.28rem;
  letter-spacing: 0.08em;
}

.scoreboard {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

h3 {
  margin: 0 0 10px;
  font-size: 1rem;
}

.scoreboard ol {
  margin: 0;
  padding-left: 0;
  list-style: none;
}

.scoreboard ol {
  min-height: 150px;
  display: grid;
  gap: 8px;
}

.scoreboard li {
  padding: 9px 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.06);
  color: var(--muted);
  font-weight: 750;
}

@media (max-width: 940px) {
  .topbar,
  .game-layout {
    display: grid;
    grid-template-columns: 1fr;
  }

  .round-controls {
    align-items: stretch;
  }

  .stage {
    min-height: 620px;
  }
}

@media (max-width: 620px) {
  .app {
    width: min(100vw - 16px, 640px);
    padding: 12px 0;
  }

  .topic-strip {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .round-controls {
    grid-template-columns: 1fr;
    display: grid;
  }

  .round-controls select {
    max-width: none;
    width: 100%;
  }

  h2 {
    min-height: 118px;
  }


  .answers {
    grid-template-columns: 1fr;
  }

  .answer {
    min-height: 78px;
  }

  .stats {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .stat {
    min-height: 68px;
    padding: 9px 6px;
  }

  .stat strong {
    font-size: 1.1rem;
  }

  .stat-wide {
    grid-column: 1 / -1;
  }
}

      .round-controls label,
      .round-controls select,
      .shelf-link { display: none; }
      h1 { max-width: 14ch; }
    </style>
  </head>
  <body>
    <main class="app" aria-label="AP Gov trivia game">
      <header class="topbar">
        <div>
          <p id="pageEyebrow" class="eyebrow">AP Gov and Politics</p>
          <h1 id="pageTitle">Review the republic.</h1>
        </div>
        <div class="round-controls">
          <button id="startRound" class="primary-action" type="button">Start Round</button>
        </div>
      </header>
      <section class="game-layout">
        <section class="stage" aria-label="Trivia question">
          <div id="topicStrip" class="topic-strip" aria-hidden="true"></div>
          <div class="question-meta"><span id="topic">Ready</span><span id="questionCount">0/0</span></div>
          <h2 id="question">Start a round when your team is ready.</h2>
          <div id="answers" class="answers" aria-label="Answer options"></div>
          <div class="timer-row" aria-label="Timer and score"><div class="timer-shell"><div id="timerBar" class="timer-bar"></div></div><strong id="timeLeft">30</strong></div>
          <p id="message" class="message" aria-live="polite">15 questions. Each one starts at 1000 points.</p>
        </section>
        <aside class="side-panel" aria-label="Score and round details">
          <section class="stats">
            <div class="stat"><span>Question Value</span><strong id="questionValue">1000</strong></div>
            <div class="stat"><span>Total Score</span><strong id="totalScore">0</strong></div>
            <div class="stat"><span>Correct</span><strong id="correctCount">0</strong></div>
            <div class="stat"><span>Streak</span><strong id="streak">0</strong></div>
            <div class="stat stat-wide"><span>Round Seed</span><strong id="roundSeed">----</strong></div>
          </section>
          <section class="scoreboard" aria-label="Round log"><h3>Round Log</h3><ol id="roundLog"></ol></section>
        </aside>
      </section>
    </main>

  questionCountEl.textContent = (currentIndex + 1) + '/' + roundQuestions.length;
  questionEl.textContent = currentQuestion.question;
  renderAnswers();
}
function renderAnswers() {
  answersEl.innerHTML = '';
  currentQuestion.options.forEach((option, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = answerClass(index);
    button.dataset.index = index;
    button.innerHTML = '<span class="letter">' + String.fromCharCode(65 + index) + '</span><span class="text"></span>';
    button.querySelector('.text').textContent = option;
    button.addEventListener('click', () => answerQuestion(index));
    answersEl.append(button);
  });
}
function answerClass(index) {
  const classes = ['answer'];
  if (hiddenOptions.has(index)) classes.push('hidden-option');
  return classes.join(' ');
}
function answerQuestion(index) {
  if (!acceptingAnswers) return;
  acceptingAnswers = false;
  clearInterval(timerId);
  const correct = index === currentQuestion.answer;
  if (correct) {
    totalScore += questionValue;
    correctCount += 1;
    streak += 1;
  } else {
    streak = 0;
  }
  highlightAnswers(index);
  logItems = [{ correct, topic: currentQuestion.topic, points: correct ? questionValue : 0, answer: currentQuestion.options[currentQuestion.answer] }, ...logItems].slice(0, 8);
  renderLog();
  updateStats();
  if (index === null) {
    showMessage('Time. Correct answer: ' + currentQuestion.options[currentQuestion.answer]);
  } else if (correct) {
    showMessage('Correct! +' + questionValue);
  } else {
    showMessage('Good try. Correct answer: ' + currentQuestion.options[currentQuestion.answer]);
  }
  setTimeout(nextQuestion, 1800);
}
function hideWrongOption(reveal) {
  const choices = currentQuestion.options.map((_, index) => index).filter((index) => index !== currentQuestion.answer && !hiddenOptions.has(index));
  if (!choices.length) return;
  hiddenOptions.add(shuffle(choices, roundRandom)[0]);
  renderAnswers();
  if (reveal) highlightAnswers(null, true);
}
function revealFinalAnswer() {
  highlightAnswers(null, true);
  showMessage('Final clue: the correct answer is highlighted.');
}
function highlightAnswers(selectedIndex, revealOnly = false) {
  [...answersEl.querySelectorAll('.answer')].forEach((button) => {
    const index = Number(button.dataset.index);
    button.className = answerClass(index);
    if (index === currentQuestion.answer) {
      button.classList.add('correct');
    } else if (!revealOnly && selectedIndex === index) {
      button.classList.add('wrong');
    }
  });
}
function finishRound() {
  acceptingAnswers = false;
  clearInterval(timerId);
  topicEl.textContent = 'Round Complete';
  questionCountEl.textContent = roundQuestions.length + '/' + roundQuestions.length;
  questionEl.textContent = 'Final score: ' + totalScore;
  answersEl.innerHTML = '';
  timerBarEl.style.width = '0%';
  timeLeftEl.textContent = '0';
  questionValue = 0;
  updateStats();
  showMessage('You got ' + correctCount + ' of ' + roundQuestions.length + ' correct.');
}
function updateStats() {
  questionValueEl.textContent = questionValue;
  totalScoreEl.textContent = totalScore;
  correctCountEl.textContent = correctCount;
  streakEl.textContent = streak;
  roundSeedEl.textContent = roundSeed || '----';
}
function renderLog() {
  roundLogEl.innerHTML = '';
  if (!logItems.length) {
    const empty = document.createElement('li');
    empty.textContent = 'No answers yet.';
    roundLogEl.append(empty);
    return;
  }
  logItems.forEach((item) => {
    const li = document.createElement('li');
    li.textContent = (item.correct ? 'Correct' : 'Miss') + ' - ' + item.topic + ' - ' + item.points + ' pts';
    roundLogEl.append(li);
  });
}
function showMessage(text) {
  messageEl.textContent = text;
}
function renderTopicStrip(topics = []) {
  const labels = topics.length ? topics : ['Trivia', 'Fast', 'Facts', 'Quiz', 'Fun'];
  topicStripEl.innerHTML = '';
  labels.slice(0, 5).forEach((label) => {
    const span = document.createElement('span');
    span.textContent = label;
    topicStripEl.append(span);
  });
}
function shuffle(items, random = Math.random) {
  const result = [...items];
  for (let index = result.length - 1; index > 0; index -= 1) {
    const swapIndex = Math.floor(random() * (index + 1));
    [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
  }
  return result;
}
function randomizeOptions(item, answerPosition, random) {
  const originalAnswer = item.options[item.answer];
  const wrongOptions = shuffle(item.options.filter((option) => option !== originalAnswer), random);
  const options = [];
  for (let index = 0; index < item.options.length; index += 1) {
    options[index] = index === answerPosition ? originalAnswer : wrongOptions.shift();
  }
  return { ...item, options, answer: answerPosition };
}
function balancedAnswerPositions(count, random) {
  const positions = [];
  for (let index = 0; index < count; index += 1) positions.push(index % 4);
  return shuffle(positions, random);
}
function makeRoundSeed() {
  const cryptoApi = window.crypto || window.msCrypto;
  if (cryptoApi && cryptoApi.getRandomValues) {
    const values = new Uint32Array(1);
    cryptoApi.getRandomValues(values);
    return values[0].toString(36).toUpperCase().padStart(7, '0').slice(-7);
  }
  return Math.floor((Date.now() + Math.random() * 0xffffffff) >>> 0).toString(36).toUpperCase().padStart(7, '0').slice(-7);
}
function seededRandom(seed) {
  let state = 2166136261;
  for (let index = 0; index < seed.length; index += 1) {
    state ^= seed.charCodeAt(index);
    state = Math.imul(state, 16777619);
  }
  return () => {
    state += 0x6d2b79f5;
    let value = state;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  };
}
startButton.addEventListener('click', startRound);
renderTopicStrip(activePack.topicStrip);
renderLog();
updateStats();
